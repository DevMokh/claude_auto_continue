name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap, analyze, test, build debug APK
        run: bash scripts/bootstrap.sh

      - uses: actions/upload-artifact@v4
        with:
          name: claude-auto-continue-debug-apk
          path: dist/*.apk
